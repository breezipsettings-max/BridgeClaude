<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f4;
      color: #1f1f1f;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e4;
      padding: 16px 24px;
      font-weight: bold;
      font-size: 1.2rem;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e5e5e4;
      border-radius: 12px;
      padding: 16px;
      min-height: 360px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      max-width: 85%;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user { background: #e8f0fe; margin-left: auto; }
    .bot { background: #f0f0ef; }
    form {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #cfcfcd;
      border-radius: 8px;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1f1f1f;
      color: #ffffff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <header>My Website</header>

  <main>
    <div id="messages">
      <div class="msg bot">Welcome! Type a message below to get started.</div>
    </div>

    <form id="chat-form">
      <input id="message" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <footer>&copy; 2026 My Website</footer>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage(data.reply || data.error || "No response.", "bot");
      } catch (err) {
        addMessage("Something went wrong. Please try again.", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
